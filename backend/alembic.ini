# Alembic — la config runtime (URL de base) est résolue dans env.py depuis les
# settings applicatifs (AGENTSCOPE_DATABASE_URL). Ne pas mettre de secret ici.

[alembic]
script_location = agentscope/infrastructure/persistence/migrations
prepend_sys_path = .
path_separator = os
# Laissé vide : env.py renseigne l'URL depuis la configuration si absente.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
