[project]
name = "agentscope"
version = "0.1.0"
description = "AgentScope — normalisation et dashboarding de traces d'agents IA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "pandas>=2.2",
  "pyarrow>=18.0",
  "duckdb>=1.1",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
]

[project.scripts]
agentscope-openapi = "agentscope.interfaces.api.openapi:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentscope*"]

# ---------------------------------------------------------------------------
# Outils
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["agentscope", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agentscope"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "agentscope"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=agentscope --cov-report=term-missing"
asyncio_mode = "auto"
filterwarnings = [
  # Bruit de versions dans les dépendances (starlette/anyio/httpx), pas notre code.
  # Filtrage par message (module et catégorie varient selon l'ordre d'import).
  "ignore:Using .httpx. with .starlette.testclient. is deprecated",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated",
  # stdlib : adaptateur datetime->SQLite déprécié en 3.12 (uniquement en tests SQLite).
  "ignore:The default datetime adapter is deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["agentscope"]

# ---------------------------------------------------------------------------
# Règle des dépendances (Clean Architecture — ADR-0002)
#
# Vérifiée par `lint-imports` : `make arch` en local, `tests/unit/test_architecture.py`
# dans la suite pytest (donc dans la CI dès que le workflow I0.3 existe).
# `include_external_packages` est indispensable : sans lui, grimp ne met pas les
# paquets tiers dans le graphe et les contrats 2 et 3 ne détecteraient jamais rien.
# ---------------------------------------------------------------------------

[tool.importlinter]
root_package = "agentscope"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "1. Sens des dépendances entre couches"
type = "layers"
# Du plus haut (peut importer) au plus bas (ne peut pas remonter).
layers = [
  "agentscope.interfaces",
  "agentscope.infrastructure",
  "agentscope.application",
  "agentscope.domain",
]

[[tool.importlinter.contracts]]
name = "2. Le domaine ne dépend d'aucun framework ni SDK"
type = "forbidden"
source_modules = ["agentscope.domain"]
forbidden_modules = [
  "fastapi",
  "starlette",
  "sqlalchemy",
  "alembic",
  "pydantic",
  "pydantic_settings",
  "httpx",
  "pandas",
  "pyarrow",
  "duckdb",
  "anthropic",
  "openai",
]

[[tool.importlinter.contracts]]
name = "3. Les cas d'utilisation ne dépendent d'aucun framework ni SDK"
type = "forbidden"
source_modules = ["agentscope.application"]
# Même liste que le domaine : les use cases parlent aux ports, jamais aux outils.
forbidden_modules = [
  "fastapi",
  "starlette",
  "sqlalchemy",
  "alembic",
  "pydantic",
  "pydantic_settings",
  "httpx",
  "pandas",
  "pyarrow",
  "duckdb",
  "anthropic",
  "openai",
]

[[tool.importlinter.contracts]]
name = "4. Seul le point de composition connaît l'infrastructure"
type = "forbidden"
# Routes et schémas passent par les ports injectés ; instancier un adaptateur
# reste réservé à `app.py` / `dependencies.py` / `main.py`.
source_modules = [
  "agentscope.interfaces.api.routes",
  "agentscope.interfaces.api.schemas",
]
forbidden_modules = ["agentscope.infrastructure"]

[[tool.importlinter.contracts]]
name = "5. Les adaptateurs d'infrastructure sont indépendants entre eux"
type = "independence"
# Un lecteur de fichier n'appelle pas la base ; un adaptateur LLM n'appelle pas
# un lecteur. Ils ne se rencontrent que dans un cas d'utilisation.
modules = [
  "agentscope.infrastructure.persistence",
  "agentscope.infrastructure.readers",
  "agentscope.infrastructure.llm",
  "agentscope.infrastructure.profiling",
]
