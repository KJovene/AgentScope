[project]
name = "agentscope"
version = "0.1.0"
description = "AgentScope — normalisation et dashboarding de traces d'agents IA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "pandas>=2.2",
  "pyarrow>=18.0",
  "duckdb>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
]

[project.scripts]
agentscope-openapi = "agentscope.interfaces.api.openapi:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentscope*"]

# ---------------------------------------------------------------------------
# Outils
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["agentscope", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agentscope"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "agentscope"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=agentscope --cov-report=term-missing"
asyncio_mode = "auto"
filterwarnings = [
  # Bruit de versions dans les dépendances (starlette/anyio/httpx), pas notre code.
  # Filtrage par message (module et catégorie varient selon l'ordre d'import).
  "ignore:Using .httpx. with .starlette.testclient. is deprecated",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]

[tool.coverage.run]
branch = true
source = ["agentscope"]

# ---------------------------------------------------------------------------
# Règle des dépendances (Clean Architecture) — vérifiée par `lint-imports` (I0.11)
# ---------------------------------------------------------------------------

[tool.importlinter]
root_package = "agentscope"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Sens des dépendances entre couches"
type = "layers"
# Du plus haut (peut importer) au plus bas (ne peut pas remonter).
layers = [
  "agentscope.interfaces",
  "agentscope.infrastructure",
  "agentscope.application",
  "agentscope.domain",
]

[[tool.importlinter.contracts]]
name = "Le domaine ne dépend d'aucun framework"
type = "forbidden"
source_modules = ["agentscope.domain"]
forbidden_modules = [
  "fastapi",
  "sqlalchemy",
  "pydantic",
  "httpx",
  "pandas",
  "pyarrow",
  "duckdb",
]

[[tool.importlinter.contracts]]
name = "L'application ne dépend ni du web, ni de l'ORM, ni d'un SDK IA"
type = "forbidden"
source_modules = ["agentscope.application"]
forbidden_modules = [
  "fastapi",
  "starlette",
  "uvicorn",
  "sqlalchemy",
  "alembic",
  "httpx",
  "pandas",
  "pyarrow",
  "duckdb",
]
